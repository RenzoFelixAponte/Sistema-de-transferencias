spring.application.name=cuentas-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/banco
spring.datasource.username=banco
# Solo para desarrollo local; en Azure la contraseña vendrá de Key Vault.
spring.datasource.password=banco
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

banco.kafka.topic-transferencias=transferencias
banco.transferencias.limite-diario=5000.00

management.endpoints.web.exposure.include=health,info,metrics
